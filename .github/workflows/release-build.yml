name: Build And Upload Release Asset

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: "GitHub Release tag to attach the Skill bundle zip to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name || github.event.inputs.tag_name, 'v')

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build release bundle
        run: npm run build

      - name: Verify bundled runtime
        run: |
          npm run smoke:runtime
          node -e "const s=require('./skills/igapyon-backlog-api/runtime/backlog-api-source.json'); if (s.source.dirty) throw new Error('release runtime must come from a clean backlog-api commit')"

      - name: Verify release tag version
        id: release_version
        shell: bash
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          case "${VERSION}" in
            "${PACKAGE_VERSION}"|"${PACKAGE_VERSION}".*) ;;
            *)
              echo "Release tag version (${VERSION}) must match package.json version (${PACKAGE_VERSION}) or add a dot suffix such as ${PACKAGE_VERSION}.2." >&2
              exit 1
              ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare release zip
        id: prepare_zip
        shell: bash
        run: |
          set -euo pipefail
          source_zip="bundle/igapyon-backlog-api-skills-${{ steps.release_version.outputs.package_version }}.zip"
          target_zip="release-assets/igapyon-backlog-api-skills-${{ steps.release_version.outputs.version }}.zip"
          if [[ ! -s "${source_zip}" ]]; then
            echo "release zip not found or empty: ${source_zip}" >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "${source_zip}" "${target_zip}"
          echo "zip_path=${target_zip}" >> "$GITHUB_OUTPUT"

      - name: Upload zip to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
          files: ${{ steps.prepare_zip.outputs.zip_path }}
          draft: false
          prerelease: false
